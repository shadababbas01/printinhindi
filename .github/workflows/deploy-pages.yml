name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # Neither `npm ci` nor a plain `npm install` is enough here — the
        # committed package-lock.json itself was generated on macOS and
        # simply doesn't list the Linux-only @rollup/rollup-linux-x64-gnu
        # optional dependency (npm/cli#4828), so npm never even tries to
        # fetch it on this Ubuntu runner unless the lockfile is dropped and
        # dependencies are re-resolved from scratch for this platform.
        run: rm -f package-lock.json && npm install

      - name: Build
        working-directory: apps/web
        env:
          GITHUB_PAGES: 'true'
          # Set these in Settings -> Secrets and variables -> Actions
          # (Variables tab is fine for the non-secret ones; the anon key
          # is safe to expose too, it's Supabase's publishable key).
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_UPI_ID: ${{ vars.VITE_UPI_ID }}
          VITE_UPI_PAYEE_NAME: ${{ vars.VITE_UPI_PAYEE_NAME }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
